<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenWeather Node.js 비동기 실습</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-box {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }
    .log-box {
      background: #0f172a;
      color: #38bdf8;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      padding: 16px;
      border-radius: 8px;
      height: 190px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="py-5">
  <div class="container" style="max-width: 820px;">

    <div class="card-box bg-dark text-white">
      <h3 class="fw-bold mb-1">☕ OpenWeather 비동기 패턴 실습 (Node.js 백엔드)</h3>
      <p class="text-secondary small mb-0">대상 도시: 서울(Seoul), 부산(Busan), 제주(Jeju), 광주(Gwangju)</p>
    </div>

    <!-- 제어판 -->
    <div class="card-box">
      <div class="row g-2 mb-3">
        <div class="col-md-5">
          <label class="form-label fw-bold small text-secondary">도시 선택</label>
          <select id="citySelect" class="form-select">
            <option value="seoul">서울 (Seoul)</option>
            <option value="busan">부산 (Busan)</option>
            <option value="jeju">제주 (Jeju)</option>
            <option value="gwangju">광주 (Gwangju)</option>
          </select>
        </div>
        <div class="col-md-7 d-flex align-items-end gap-2">
          <button id="btnPromise" class="btn btn-outline-primary flex-fill fw-bold py-2">
            1. Promise 방식 (.then)
          </button>
          <button id="btnAsync" class="btn btn-primary flex-fill fw-bold py-2">
            2. async / await 방식
          </button>
        </div>
      </div>
      <button id="btnAll" class="btn btn-success w-100 fw-bold py-2">
        3. 4개 도시 일괄 병렬 조회 (Promise.all)
      </button>
    </div>

    <!-- 날씨 카드 렌더링 영역 -->
    <div class="card-box">
      <h6 class="fw-bold mb-3 text-secondary">조회 결과 카드</h6>
      <div class="row g-3" id="displayArea">
        <div class="col-12 text-center text-muted small py-3">상단 버튼을 눌러 조회를 시작하세요.</div>
      </div>
    </div>

    <!-- 콘솔 로그 창 -->
    <div class="card-box">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-bold small text-dark">📜 실시간 통신 로그 (Console)</span>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">초기화</button>
      </div>
      <div class="log-box" id="logBox">> 시스템 대기 중.</div>
    </div>

  </div>

  <script>
    const citySelect = document.getElementById('citySelect');
    const logBox = document.getElementById('logBox');
    const displayArea = document.getElementById('displayArea');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logBox.textContent += `\n[${time}] ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function clearLog() {
      logBox.textContent = '> 콘솔이 초기화되었습니다.';
    }

    function renderCards(items) {
      displayArea.innerHTML = items.map(item => `
        <div class="col-md-6 col-lg-3">
          <div class="card p-3 border text-center shadow-none bg-light">
            <div class="d-flex justify-content-center align-items-center">
              <img src="https://openweathermap.org/img/wn/${item.icon}@2x.png" width="45" height="45" />
              <span class="fw-bold fs-6">${item.regionName}</span>
            </div>
            <h3 class="fw-bold text-primary my-1">${item.temperature} ℃</h3>
            <div class="small text-muted">${item.description}</div>
            <div class="small text-secondary mt-1">습도 ${item.humidity}% | 풍속 ${item.windSpeed}m/s</div>
          </div>
        </div>
      `).join('');
    }

    /* 1. 순수 Promise (.then) 방식 호출 */
    document.getElementById('btnPromise').addEventListener('click', () => {
      const city = citySelect.value;
      log(`[Promise] 1. GET /api/weather/promise?city=${city} 호출 시작`);
      displayArea.innerHTML = '<div class="col-12 text-center text-muted">불러오는 중...</div>';

      fetch(`/api/weather/promise?city=${city}`)
        .then(res => {
          log(`[Promise] 2. 응답 수신 (HTTP 상태: ${res.status})`);
          if (!res.ok) throw new Error(`HTTP 에러: ${res.status}`);
          return res.json();
        })
        .then(result => {
          if (!result.success) throw new Error(result.error);
          log(`[Promise] 3. 완료! 데이터: ${result.data.regionName} (${result.data.temperature}℃)`);
          renderCards([result.data]);
        })
        .catch(err => {
          log(`[Promise] ❌ 오류 발생: ${err.message}`);
          displayArea.innerHTML = `<div class="col-12 text-center text-danger">${err.message}</div>`;
        });
    });

    /* 2. async / await 방식 호출 */
    document.getElementById('btnAsync').addEventListener('click', async () => {
      const city = citySelect.value;
      log(`[async/await] 1. GET /api/weather/async?city=${city} 호출 시작`);
      displayArea.innerHTML = '<div class="col-12 text-center text-muted">불러오는 중...</div>';

      try {
        const res = await fetch(`/api/weather/async?city=${city}`);
        log(`[async/await] 2. 응답 완료 (HTTP 상태: ${res.status})`);
        if (!res.ok) throw new Error(`HTTP 에러: ${res.status}`);

        const result = await res.json();
        if (!result.success) throw new Error(result.error);

        log(`[async/await] 3. 완료! 데이터: ${result.data.regionName} (${result.data.temperature}℃)`);
        renderCards([result.data]);
      } catch (err) {
        log(`[async/await] ❌ 오류 발생: ${err.message}`);
        displayArea.innerHTML = `<div class="col-12 text-center text-danger">${err.message}</div>`;
      }
    });

    /* 3. Promise.all 일괄 병렬 호출 */
    document.getElementById('btnAll').addEventListener('click', async () => {
      log(`[Promise.all] 1. GET /api/weather/all 4개 도시 일괄 호출 시작`);
      displayArea.innerHTML = '<div class="col-12 text-center text-muted">4개 도시 데이터 병렬 수집 중...</div>';

      try {
        const res = await fetch('/api/weather/all');
        const result = await res.json();
        if (!result.success) throw new Error(result.error);

        log(`[Promise.all] 2. 4개 도시 동시 수령 성공! 소요 시간: ${result.durationMs}ms`);
        renderCards(result.data);
      } catch (err) {
        log(`[Promise.all] ❌ 오류 발생: ${err.message}`);
        displayArea.innerHTML = `<div class="col-12 text-center text-danger">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
