<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenWeather FastAPI 비동기 실습</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: #f1f5f9; }
    .panel { background: white; border-radius: 14px; padding: 24px; margin-bottom: 18px; }
    #logBox { background: #0f172a; color: #38bdf8; padding: 16px; height: 180px; overflow: auto; white-space: pre-wrap; font: 13px Consolas, monospace; }
  </style>
</head>
<body class="py-5">
  <main class="container" style="max-width:820px">
    <section class="panel bg-dark text-white">
      <h1 class="h4">OpenWeather 비동기 패턴 실습 (FastAPI)</h1>
      <p class="mb-0">브라우저 → FastAPI → OpenWeather | 서울·부산·제주·광주</p>
    </section>
    <section class="panel">
      <label for="citySelect" class="form-label">도시 선택</label>
      <select id="citySelect" class="form-select mb-3">
        <option value="seoul">서울</option><option value="busan">부산</option>
        <option value="jeju">제주</option><option value="gwangju">광주</option>
      </select>
      <div class="d-flex flex-wrap gap-2">
        <button id="btnPromise" class="btn btn-outline-primary">1. Promise (.then)</button>
        <button id="btnAsync" class="btn btn-primary">2. async / await</button>
        <button id="btnAll" class="btn btn-success">3. 네 도시 병렬 조회 (Promise.all)</button>
      </div>
    </section>
    <section class="panel"><h2 class="h6">조회 결과</h2><div id="displayArea" class="row g-3">버튼을 눌러 조회하세요.</div></section>
    <section class="panel"><h2 class="h6">단계별 로그</h2><button id="btnClear" class="btn btn-sm btn-outline-secondary mb-2">초기화</button><div id="logBox">&gt; 대기 중</div></section>
  </main>
  <script>
    const citySelect = document.getElementById('citySelect');
    const displayArea = document.getElementById('displayArea');
    const logBox = document.getElementById('logBox');
    const buttons = ['btnPromise', 'btnAsync', 'btnAll'].map(id => document.getElementById(id));
    const cities = ['seoul', 'busan', 'jeju', 'gwangju'];
    let requestNumber = 0;

    function log(message) {
      logBox.textContent += `\n[${new Date().toLocaleTimeString()}] ${message}`;
      logBox.scrollTop = logBox.scrollHeight;
    }
    function busy(value) { buttons.forEach(button => button.disabled = value); }
    function showError(error) {
      displayArea.replaceChildren();
      const line = document.createElement('p');
      line.className = 'text-danger';
      line.textContent = error.message;
      displayArea.append(line);
      log(`오류: ${error.message}`);
    }
    function showCards(items) {
      displayArea.replaceChildren();
      for (const item of items) {
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-3';
        const card = document.createElement('div');
        card.className = 'card p-3 h-100 text-center';
        const title = document.createElement('strong');
        title.textContent = item.regionName;
        const temp = document.createElement('div');
        temp.className = 'fs-4 text-primary';
        temp.textContent = `${item.temperature} °C`;
        const extra = document.createElement('div');
        extra.textContent = `${item.description} · 습도 ${item.humidity}% · 풍속 ${item.windSpeed} m/s`;
        const image = document.createElement('img');
        image.src = `https://openweathermap.org/img/wn/${encodeURIComponent(item.icon)}@2x.png`;
        image.alt = item.description;
        image.width = 55; image.height = 55;
        card.append(image, title, temp, extra);
        col.append(card);
        displayArea.append(col);
      }
    }
    function begin(label) {
      requestNumber += 1;
      busy(true);
      displayArea.textContent = '불러오는 중...';
      log(label);
      return requestNumber;
    }
    function finish(number) { if (number === requestNumber) busy(false); }

    // 1. Promise 체인: fetch와 response.json()이 각각 Promise를 반환합니다.
    document.getElementById('btnPromise').addEventListener('click', () => {
      const city = citySelect.value;
      const number = begin(`[Promise] ${city} 요청`);
      fetch(`/api/weather?city=${city}`)
        .then(response => {
          log(`[Promise] HTTP ${response.status}`);
          if (!response.ok) throw new Error(`서버 오류: HTTP ${response.status}`);
          return response.json();
        })
        .then(result => { log('[Promise] JSON 변환 완료'); showCards([result.data]); })
        .catch(showError)
        .finally(() => finish(number));
    });

    // 2. 같은 API를 async/await 구문으로 호출합니다.
    document.getElementById('btnAsync').addEventListener('click', async () => {
      const city = citySelect.value;
      const number = begin(`[async/await] ${city} 요청`);
      try {
        const response = await fetch(`/api/weather?city=${city}`);
        log(`[async/await] HTTP ${response.status}`);
        if (!response.ok) throw new Error(`서버 오류: HTTP ${response.status}`);
        const result = await response.json();
        log('[async/await] JSON 변환 완료');
        showCards([result.data]);
      } catch (error) { showError(error); }
      finally { finish(number); }
    });

    // 3. 브라우저에서 네 요청을 동시에 시작합니다. 하나라도 실패하면 전체가 실패합니다.
    document.getElementById('btnAll').addEventListener('click', async () => {
      const number = begin('[Promise.all] 네 도시 요청 시작');
      const started = performance.now();
      try {
        const jobs = cities.map(async city => {
          const response = await fetch(`/api/weather?city=${city}`);
          if (!response.ok) throw new Error(`${city}: HTTP ${response.status}`);
          const result = await response.json();
          return result.data;
        });
        const items = await Promise.all(jobs);
        log(`[Promise.all] 네 도시 완료: ${Math.round(performance.now() - started)} ms`);
        showCards(items);
      } catch (error) { showError(error); }
      finally { finish(number); }
    });
    document.getElementById('btnClear').addEventListener('click', () => { logBox.textContent = '> 로그 초기화'; });
  </script>
</body>
</html>
